; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[common]

ota_pass = ${sysenv.SMARTHOME_OTA_PASSWD}

build_flags_home =
  -D _WIFI_SSID_=\"${sysenv.SMARTHOME_WIFI_SSID}\"
  -D _WIFI_PWD_=\"${sysenv.SMARTHOME_WIFI_PWD}\"
  -D _MQTT_BROKER_=\"${sysenv.SMARTHOME_MQTT_BROKER}\"

build_flags_office =
  -D _WIFI_SSID_=\"${sysenv.SMARTHOME_WIFI_SSID_OFFICE}\"
  -D _WIFI_PWD_=\"${sysenv.SMARTHOME_WIFI_PWD_OFFICE}\"
  -D _MQTT_BROKER_=\"${sysenv.SMARTHOME_MQTT_BROKER_OFFICE}\"

build_flags = ${this.build_flags_home}

[env]
framework = arduino

lib_deps = 
	bblanchon/ArduinoJson @ ~6.19.4
	knolleary/PubSubClient @ ~2.8
  adafruit/Adafruit ADS1X15 @ ^2.5.0        ; ADS1015/1115 ADC
  SPI                                       ; required by Adafruit ADS1X15

build_flags = 
  -D _OTA_PASSWD_=\"${common.ota_pass}\"


;; ======================================
;; ESP32 RELEASE OTA  (default)
;; ======================================
; esp32dev - Espressif ESP32 Dev Module
[env:RELEASE_OTA_esp32dv]
platform = espressif32
board = wemos_d1_mini32
; board = esp32dev
;board = nodemcu-32s

hostname = watercontroller1
area = home

monitor_port = COM7
monitor_speed = 115200

upload_protocol = espota
; upload_port = 192.168.1.159
upload_port = ${this.hostname}
; upload_port = ESP32-D71ED8
upload_flags = --auth=${common.ota_pass}

build_flags =
  -D_SN_TEST_BUILD_=\"1\"
; -D_SN_PROD_BUILD_
  -D_HOST_NAME_=\"${this.hostname}\"
  -D_AREA_=\"${this.area}\"
  ${env.build_flags}
  ${common.build_flags}
  -DDEBUG_ESP_PORT=Serial
  -DDEBUG_ESP_WIFI
;  -DDEBUG_ESP_CORE           ; No visiable output on ESP32, Doesn't help resolve ping and MQTT TCP issue
;  -DUMM_POISON_CHECK_LITE    ; No visiable output
;  -DDEBUG_ESP_MMU            ; No visiable output
;  -DDEBUG_AA1                ; No visiable output


;; ======================================
;; ESP32 RELEASE Serial
;; ======================================
; esp32dev - Espressif ESP32 Dev Module
[env:RELEASE_COM_esp32dv]
platform = espressif32
board = wemos_d1_mini32
;board = esp32dev
;board = nodemcu-32s
framework = arduino

hostname = watercontroller1
area = home

monitor_port = COM7
monitor_speed = 115200

upload_port = COM7
upload_speed = 115200
; upload_speed = 600000

build_flags =
  -D_SN_TEST_BUILD_
; -D_SN_PROD_BUILD_
  -D_HOST_NAME_=\"${this.hostname}\"
  -D_AREA_=\"${this.area}\"
  ${env.build_flags}
  ${common.build_flags}
  -DDEBUG_ESP_PORT=Serial
  -DDEBUG_ESP_WIFI
;  -DDEBUG_BAD_IP
;  -DDEBUG_ESP_CORE           ; No visiable output on ESP32, Doesn't help resolve ping and MQTT TCP issue
;  -DUMM_POISON_CHECK_LITE    ; No visiable output
;  -DDEBUG_ESP_MMU            ; No visiable output
;  -DDEBUG_AA1                ; No visiable output

